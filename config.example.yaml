app:
  # fr / en / de / es / zh. On first run DocSpecBridge detects the OS language.
  language: fr
  source: "./input"
  destination: "./output"
  extensions:
    - ".docx"
    - ".pdf"
    - ".pptx"
  recursive: true
  preserve_source_tree: true
  copy_source: true
  overwrite: false

extract:
  engine: "xberg"
  use_cache: true
  enable_quality_processing: true
  output_format: "markdown"
  extraction_timeout_secs: 600

  images:
    extract_images: true
    target_dpi: 300
    max_image_dimension: 4096
    auto_adjust_dpi: true
    inject_placeholders: true
    include_data_base64: true
    run_ocr_on_images: false

  deduplicate_assets: true

  docx_layout:
    include_header_images_once: true
    include_footer_images_once: false

  pdf_layout:
    collapse_repeated_images: true
    repeat_threshold: 3

  pdf_options:
    extract_images: true
    extract_tables: true
    extract_metadata: true

  diagnostics:
    inspect_ooxml: true
    warn_on_unresolved_images: true
    # Off by default: raw Xberg Markdown is a troubleshooting artifact only.
    keep_raw_xberg_markdown: false

profiles:
  publication:
    enabled: true
    preserve_image_display_size: true
    display_image_directory: "publication_images"
    min_display_px: 12
    max_display_px: 1800
    avoid_upscale: false
    preserve_formatting: true
    # Adds a deterministic title in front matter so Confluence does not use filename+digest.
    add_title_front_matter: true
    table_of_contents:
      # auto = replace a detected source TOC with md2conf's native Confluence TOC macro.
      enabled: auto
      replace_source_toc: true

  rag:
    enabled: true
    write_descriptor: true
    keep_image_references: true
    include_header_images: false
    include_footer_images: false
    collapse_repeated_images: true
    token_reduction: "off"
    chunking:
      enabled: true
      max_characters: 1600
      overlap: 150
      prepend_heading_context: true

rag_export:
  # Target-neutral corpus export used by `docspecbridge doc2rag` / `rag-export`.
  destination: "./rag"
  copy_assets: true
  copy_document_json: true
  overwrite: true

confluence:
  default_instance: "production"

  instances:
    production:
      # Cloud only. Store a bare host; https:// and trailing slash are normalized automatically.
      domain: "company.atlassian.net"
      auth_type: "classic"
      user_name: "user@example.com"
      token_env: "ATLASSIAN_API_TOKEN"
      cloud_id: ""
      api_url: ""
      base_path: "/wiki/"
      api_version: "v2"
      default_space: ""
      root_page: ""

    # Example with an API token with scopes:
    # scoped-production:
    #   domain: "company.atlassian.net"
    #   auth_type: "scoped"
    #   user_name: "user@example.com"
    #   token_env: "ATLASSIAN_SCOPED_API_TOKEN"
    #   cloud_id: "00000000-0000-0000-0000-000000000000"
    #   api_url: "https://api.atlassian.com/ex/confluence/00000000-0000-0000-0000-000000000000"
    #   base_path: "/wiki/"
    #   api_version: "v2"
    #   default_space: ""
    #   root_page: ""

  keep_hierarchy: false
  overwrite_manual_changes: false
  comments: "remove"          # remove | check-open
  write_page_id_to_markdown: true
  heading_anchors: true

  layout:
    alignment: "center"
    image_alignment: "center"
    image_max_width: 1600
    table_width: null
    table_display_mode: "responsive"

  render_mermaid: false
