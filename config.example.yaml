app:
  # fr / en / de / es / zh. On first run DocSpecBridge detects the OS language.
  language: fr
  source: "./input"
  destination: "./output"
  recursive: true
  preserve_source_tree: true
  copy_source: true
  overwrite: false

extract:
  engine: "xberg"
  use_cache: true
  enable_quality_processing: true
  output_format: "markdown"
  extraction_timeout_secs: 600

  images:
    extract_images: true
    target_dpi: 300
    max_image_dimension: 4096
    auto_adjust_dpi: true
    inject_placeholders: true
    include_data_base64: true
    run_ocr_on_images: false

  deduplicate_assets: true

  docx_layout:
    include_header_images_once: true
    include_footer_images_once: false

  pdf_layout:
    collapse_repeated_images: true
    repeat_threshold: 3

  pdf_options:
    extract_images: true
    extract_tables: true
    extract_metadata: true

  diagnostics:
    inspect_ooxml: true
    warn_on_unresolved_images: true
    # Off by default: raw Xberg Markdown is a troubleshooting artifact only.
    keep_raw_xberg_markdown: false

profiles:
  publication:
    enabled: true
    preserve_image_display_size: true
    display_image_directory: "publication_images"
    min_display_px: 12
    max_display_px: 1800
    avoid_upscale: false
    preserve_formatting: true
    docx:
      # Mammoth + OOXML feed CanonicalDocument. Human Markdown, RAG and the
      # technical Confluence renderer are then produced independently from the canon.
      engine: "mammoth-html"
      preserve_merged_cells: true
      preserve_lists: true
      preserve_highlight_colors: true
      preserve_cell_shading: true
      preserve_cell_text_color: true
      # Hide text that only lives in floating DrawingML/VML text boxes. Without
      # geometry these labels can otherwise appear as misleading standalone lines.
      suppress_floating_textboxes_in_flow: true
    # Adds a deterministic title in front matter so Confluence does not use filename+digest.
    add_title_front_matter: true
    table_of_contents:
      # auto = replace a detected source TOC with md2conf's native Confluence TOC macro.
      enabled: auto
      replace_source_toc: true

  rag:
    enabled: true
    write_descriptor: true
    keep_image_references: true
    include_header_images: false
    include_footer_images: false
    collapse_repeated_images: true
    token_reduction: "off"
    chunking:
      enabled: true
      max_characters: 1600
      overlap: 150
      prepend_heading_context: true

rag_export:
  # Target-neutral corpus export used by `docspecbridge doc2rag` / `rag-export`.
  destination: "./rag"
  copy_assets: true
  copy_document_json: true
  overwrite: true

confluence:
  default_instance: "production"

  instances:
    production:
      # Cloud only. Store a bare host; https:// and trailing slash are normalized automatically.
      domain: "company.atlassian.net"
      auth_type: "classic"
      user_name: "user@example.com"
      token_env: "ATLASSIAN_API_TOKEN"
      cloud_id: ""
      api_url: ""
      base_path: "/wiki/"
      api_version: "v2"
      default_space: ""
      root_page: ""

    # Example with an API token with scopes:
    # scoped-production:
    #   domain: "company.atlassian.net"
    #   auth_type: "scoped"
    #   user_name: "user@example.com"
    #   token_env: "ATLASSIAN_SCOPED_API_TOKEN"
    #   cloud_id: "00000000-0000-0000-0000-000000000000"
    #   api_url: "https://api.atlassian.com/ex/confluence/00000000-0000-0000-0000-000000000000"
    #   base_path: "/wiki/"
    #   api_version: "v2"
    #   default_space: ""
    #   root_page: ""

  # Parent selector always includes the real space homepage as the visible root choice.
  # 0 = space root + first-level pages, 1 = + children, 2 = + grandchildren.
  page_selector:
    max_depth: 0

  # Confluence page width: narrow | wide | max | confluence-default.
  page_width: "max"

  keep_hierarchy: false
  overwrite_manual_changes: false
  comments: "remove"          # remove | check-open
  # Kept only for backward-compatible YAML loading. 0.5.x never mutates generated publication Markdown.
  write_page_id_to_markdown: false
  heading_anchors: true

  publication:
    default_mode: "replace"             # replace | add
    page_title_source: "document_title" # document_title | filename
    add_title_suffix: " ({n})"
    verify_after_publish: true
    # Additional files attached to the published page: none | source | rendered | all
    attachments: "none"
    # Add a ZIP of the complete package in addition to selected individual files.
    attachment_zip: false

  export:
    # Attachments downloaded when Confluence is used as a source: none | images | all
    attachment_mode: "all"
    zip_package: false

  layout:
    alignment: "center"
    image_alignment: "center"
    image_max_width: 1600
    table_width: null
    table_display_mode: "responsive"

  # md2conf converter features. Diagram renderers need external tools and are
  # therefore opt-in; the remaining options use safe Cloud-oriented defaults.
  converter:
    force_valid_url: true
    skip_title_heading: false
    prefer_raster: true
    render_drawio: false
    render_mermaid: false
    render_plantuml: false
    render_latex: false
    diagram_output_format: "png"
    webui_links: false
    user_mentions: true
    use_panel: false
    force_valid_language: true

  # Deprecated compatibility key. Prefer confluence.converter.render_mermaid.
  render_mermaid: false

canonical:
  schema_version: "1.0"
  validate: true
  write_html: true

html:
  fetch:
    prefer_main: true
    download_images: true
    copy_local_images: true
    timeout_seconds: 30
    user_agent: "DocSpecBridge/0.5.1"

jira:
  # Optional. If instances is empty, jira2md/md2jira reuse Confluence instance credentials.
  default_instance: ""
  instances: {}
  # Optional per-instance defaults selected interactively from Jira.
  # Example:
  # defaults:
  #   production:
  #     project: DIGOBS
  #     issue_type: Story
  defaults: {}
  discovery:
    # Interactive issue browser: only one page is loaded at a time.
    page_size: 50
  export:
    include_comments: true
    include_attachments: true
    include_changelog: false
    attachment_mode: "all"
    zip_package: false
  import:
    # Resume an existing partially-created issue using jira_publication_state.json.
    resume: true
    upload_images: true
    upload_attachments: true
