[project]
name = "docspecbridge"
version = "0.2.0b1"
description = "Document ETL bridge: Office/PDF -> Markdown + images -> Confluence/RAG-ready packages"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "DocSpecBridge contributors" }
]
dependencies = [
  "xberg==1.0.14",
  "markdown-to-confluence==0.6.3",
  "typer>=0.16,<1",
  "rich>=14,<15",
  "PyYAML>=6.0.2,<7",
  "httpx>=0.28,<1",
  "Pillow>=11.3,<13",
  "python-pptx>=1.0.2,<2",
  "PyMuPDF>=1.26,<2",
]

[project.scripts]
docspecbridge = "docspecbridge.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docspecbridge"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["src"]
