[project]
name = "docspecbridge"
version = "0.5.4"
description = "Canonical specification bridge: Office/PDF/HTML/Markdown/Confluence/Jira -> Markdown, HTML, RAG, Confluence and Jira"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "DocSpecBridge contributors" }
]
dependencies = [
  "xberg==1.0.14",
  "markdown-to-confluence==0.6.3",
  "mammoth==1.12.1",
  "lxml>=6,<7",
  "typer>=0.16,<1",
  "rich>=14,<15",
  "prompt-toolkit>=3.0,<4",
  "PyYAML>=6.0.2,<7",
  "httpx>=0.28,<1",
  "Pillow>=12,<13",
  "python-docx>=1.2,<2",
  "python-pptx>=1.0.2,<2",
  "PyMuPDF>=1.26,<2",
  "openpyxl>=3.1,<4",
]

[project.urls]
Homepage = "https://github.com/orenault/docspecbridge"
Repository = "https://github.com/orenault/docspecbridge"
Issues = "https://github.com/orenault/docspecbridge/issues"

[project.scripts]
docspecbridge = "docspecbridge.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docspecbridge"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["src"]
